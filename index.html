<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>절기 농부 키우기 - 농사 지식 타이쿤</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body { font-family: 'Pretendard', sans-serif; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-emerald-950 text-emerald-100 min-h-screen flex flex-col selection:bg-amber-500 selection:text-white" x-data="farmGame()">

    <!-- 상단 헤더 -->
    <header class="bg-emerald-900/80 backdrop-blur-md border-b border-emerald-800 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" @click="currentTab = 'game'">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-emerald-600 flex items-center justify-center shadow-lg shadow-amber-500/20 text-xl">
                    🌾
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-tight text-white">절기 농부 키우기</h1>
                    <p class="text-xs text-emerald-300">24절기와 함께 배우는 전통 농경 타이쿤</p>
                </div>
            </div>

            <!-- 네비게이션 탭 -->
            <nav class="flex items-center space-x-1 bg-emerald-900/60 p-1 rounded-xl border border-emerald-700/50">
                <button @click="currentTab = 'game'" :class="currentTab === 'game' ? 'bg-amber-600 text-white shadow' : 'text-emerald-300 hover:text-white'" class="px-4 py-1.5 rounded-lg text-sm font-medium transition">농장 경영</button>
                <button @click="currentTab = 'dictionary'" :class="currentTab === 'dictionary' ? 'bg-amber-600 text-white shadow' : 'text-emerald-300 hover:text-white'" class="px-4 py-1.5 rounded-lg text-sm font-medium transition">절기 도감 📖</button>
            </nav>
        </div>
    </header>

    <!-- 메인 컨텐츠 영역 -->
    <main class="flex-grow max-w-5xl mx-auto px-4 py-8 w-full">

        <!-- [탭 1] 농장 경영 게임 -->
        <div x-show="currentTab === 'game'" x-cloak class="space-y-6">
            
            <!-- 상단 상태바 (현재 절기 및 자원) -->
            <div class="bg-emerald-900/70 border border-emerald-700/60 rounded-3xl p-6 shadow-xl grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
                <div class="bg-emerald-950/60 p-4 rounded-2xl border border-emerald-800">
                    <span class="text-xs text-emerald-400 block mb-1">현재 절기 (턴)</span>
                    <span class="text-lg md:text-xl font-bold text-amber-400" x-text="currentTerm.name"></span>
                    <span class="text-xs text-emerald-300 block mt-1" x-text="currentTerm.season"></span>
                </div>
                <div class="bg-emerald-950/60 p-4 rounded-2xl border border-emerald-800">
                    <span class="text-xs text-emerald-400 block mb-1">보유 자금 (엽전)</span>
                    <span class="text-xl font-bold text-amber-300" x-text="`${money} 냥`"></span>
                </div>
                <div class="bg-emerald-950/60 p-4 rounded-2xl border border-emerald-800">
                    <span class="text-xs text-emerald-400 block mb-1">농사 지식 점수</span>
                    <span class="text-xl font-bold text-emerald-300" x-text="`${knowledge} 점`"></span>
                </div>
                <div class="bg-emerald-950/60 p-4 rounded-2xl border border-emerald-800 flex flex-col justify-center">
                    <span class="text-xs text-emerald-400 block mb-1">진행도</span>
                    <span class="text-sm font-bold text-white" x-text="`${termIndex + 1} / 24 절기 완료`"></span>
                </div>
            </div>

            <!-- 논밭 현황 및 작업 카드 -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                
                <!-- 왼쪽: 밭 상태 시각화 -->
                <div class="md:col-span-1 bg-emerald-900/70 border border-emerald-700/60 rounded-3xl p-6 flex flex-col justify-between space-y-4 shadow-xl">
                    <div class="space-y-3">
                        <div class="flex justify-between items-center">
                            <h3 class="font-bold text-white text-base">🌱 나의 논밭</h3>
                            <span class="text-xs px-2.5 py-1 rounded-full bg-emerald-800 text-emerald-200" x-text="cropStatusText"></span>
                        </div>
                        <div class="w-full h-40 bg-emerald-950/80 rounded-2xl border border-emerald-800 flex flex-col items-center justify-center p-4 text-center relative overflow-hidden">
                            <span class="text-5xl mb-2 animate-bounce" x-text="cropEmoji"></span>
                            <span class="text-sm font-semibold text-amber-200" x-text="cropName"></span>
                            <div class="w-full bg-emerald-900 h-2 rounded-full mt-3 overflow-hidden border border-emerald-700">
                                <div class="bg-amber-500 h-full transition-all duration-500" :style="`width: ${growthRate}%`"></div>
                            </div>
                            <span class="text-[10px] text-emerald-400 mt-1" x-text="`성장률: ${growthRate}%`"></span>
                        </div>
                    </div>

                    <div class="space-y-2">
                        <template x-if="cropStage === 0">
                            <button @click="openSeedModal" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-3 rounded-xl text-sm transition shadow-lg shadow-amber-600/20">작물 파종하기</button>
                        </template>
                        <template x-if="cropStage > 0 && cropStage < 3">
                            <button @click="doFarmWork" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl text-sm transition shadow-lg shadow-emerald-600/20" x-text="workButtonText"></button>
                        </template>
                        <template x-if="cropStage === 3">
                            <button @click="harvestCrop" class="w-full bg-yellow-500 hover:bg-yellow-400 text-emerald-950 font-extrabold py-3 rounded-xl text-sm transition shadow-lg shadow-yellow-500/20 animate-pulse">수확하기! 💰</button>
                        </template>
                    </div>
                </div>

                <!-- 오른쪽: 절기 지식 가이드 및 농사 지혜 -->
                <div class="md:col-span-2 bg-emerald-900/70 border border-emerald-700/60 rounded-3xl p-6 space-y-6 shadow-xl flex flex-col justify-between">
                    <div class="space-y-4">
                        <div class="flex items-center justify-between border-b border-emerald-800 pb-3">
                            <div>
                                <span class="text-xs font-semibold text-amber-400 uppercase tracking-wider" x-text="currentTerm.season"></span>
                                <h2 class="text-2xl font-extrabold text-white" x-text="currentTerm.name"></h2>
                            </div>
                            <span class="text-3xl" x-text="currentTerm.emoji"></span>
                        </div>

                        <!-- 절기 설명 -->
                        <div class="space-y-2">
                            <h4 class="text-xs font-bold text-emerald-300">📜 절기 전통 지식 및 농사 속담</h4>
                            <p class="text-sm text-emerald-100 leading-relaxed bg-emerald-950/60 p-4 rounded-2xl border border-emerald-800" x-text="currentTerm.desc"></p>
                        </div>

                        <!-- 농사 팁 -->
                        <div class="space-y-1 bg-emerald-950/40 p-3.5 rounded-xl border border-emerald-800/80 text-xs">
                            <strong class="text-amber-300 block mb-1">💡 이 절기의 농사 지혜:</strong>
                            <span class="text-emerald-200" x-text="currentTerm.tip"></span>
                        </div>
                    </div>

                    <!-- 다음 절기로 넘어가기 버튼 -->
                    <div class="pt-4 border-t border-emerald-800 flex justify-end">
                        <button @click="nextTerm" class="bg-amber-600 hover:bg-amber-500 text-white font-semibold px-6 py-2.5 rounded-xl text-sm transition shadow">
                            다음 절기로 이동 ➡️
                        </button>
                    </div>
                </div>

            </div>
        </div>

        <!-- [탭 2] 절기 도감 -->
        <div x-show="currentTab === 'dictionary'" x-cloak class="space-y-6">
            <div class="text-center space-y-2">
                <h2 class="text-3xl font-bold text-white">24절기 농경 대백과 📖</h2>
                <p class="text-emerald-300 text-sm">조상들이 한 해 동안 농사를 짓고 계절의 변화를 파악했던 24절기의 모든 지식입니다.</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <template x-for="(term, index) in termsList" :key="index">
                    <div class="bg-emerald-900/60 border border-emerald-800 rounded-2xl p-5 space-y-3 hover:border-amber-500/50 transition">
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-bold px-2.5 py-1 rounded-lg bg-emerald-800 text-emerald-200" x-text="term.season"></span>
                            <span class="text-2xl" x-text="term.emoji"></span>
                        </div>
                        <div>
                            <h3 class="text-lg font-bold text-white mb-1" x-text="term.name"></h3>
                            <p class="text-xs text-emerald-300 leading-relaxed" x-text="term.desc"></p>
                        </div>
                        <div class="bg-emerald-950/70 p-2.5 rounded-xl border border-emerald-800/60 text-[11px]">
                            <strong class="text-amber-400">농사 속담/지혜:</strong> <span class="text-emerald-200" x-text="term.tip"></span>
                        </div>
                    </div>
                </template>
            </div>
        </div>

    </main>

    <!-- 씨앗 선택 모달 -->
    <div x-show="seedModalOpen" x-cloak class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm" @click.self="seedModalOpen = false">
        <div class="bg-emerald-900 border border-emerald-700 rounded-3xl max-w-md w-full p-6 space-y-6 shadow-2xl">
            <div class="flex justify-between items-center">
                <h3 class="text-xl font-bold text-white">🌱 심을 작물 선택하기</h3>
                <button @click="seedModalOpen = false" class="text-emerald-300 hover:text-white text-lg">✕</button>
            </div>
            <p class="text-xs text-emerald-300">현재 절기에 맞는 작물을 선택하면 수확량이 늘어납니다!</p>

            <div class="space-y-3">
                <template x-for="seed in availableSeeds" :key="seed.id">
                    <div @click="selectSeed(seed)" class="bg-emerald-950/80 border border-emerald-800 hover:border-amber-500 p-4 rounded-2xl cursor-pointer transition flex items-center justify-between group">
                        <div class="flex items-center space-x-3">
                            <span class="text-3xl" x-text="seed.emoji"></span>
                            <div>
                                <h4 class="font-bold text-white text-sm group-hover:text-amber-400 transition" x-text="seed.name"></h4>
                                <p class="text-xs text-emerald-400" x-text="`필요 자금: ${seed.cost} 냥 | 예상 수익: ${seed.reward} 냥`"></p>
                            </div>
                        </div>
                        <span class="text-xs font-semibold bg-amber-600 text-white px-3 py-1.5 rounded-xl">선택</span>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <!-- 푸터 -->
    <footer class="bg-emerald-950 border-t border-emerald-900 py-6 mt-16 text-center text-xs text-emerald-400">
        <p>&copy; 2026 절기 농부 키우기. 전통 농업 지식 교육용 웹 애플리케이션.</p>
    </footer>

    <!-- 게임 로직 스크립트 (Alpine.js) -->
    <script>
        function farmGame() {
            return {
                currentTab: 'game',
                termIndex: 0,
                money: 100,
                knowledge: 10,
                seedModalOpen: false,

                // 작물 상태: 0=미파종, 1=새싹, 2=자라는중, 3=수확가능
                cropStage: 0,
                cropName: '없음',
                cropEmoji: '🟫',
                growthRate: 0,
                currentCropData: null,

                availableSeeds: [
                    { id: 'rice', name: '벼 (쌀)', emoji: '🌾', cost: 30, reward: 80, desc: '한국 전통 농사의 핵심 주식물' },
                    { id: 'barley', name: '보리', emoji: '🌿', cost: 20, reward: 50, desc: '보릿고개를 넘기게 해주는 구황작물' },
                    { id: 'bean', name: '콩', emoji: '🫘', cost: 15, reward: 40, desc: '땅을 비옥하게 만드는 두류 작물' },
                    { id: 'ginseng', name: '인삼', emoji: '🥕', cost: 50, reward: 150, desc: '귀한 약초로 높은 수익을 냄' }
                ],

                termsList: [
                    { season: '봄', name: '입춘 (立春)', emoji: '🌱', desc: '봄의 시작을 알리는 절기로, 대지 기운이 돌기 시작합니다.', tip: '봄 농사를 준비하고 거름을 밭에 뿌립니다.', termIndex: 0 },
                    { season: '봄', name: '우수 (雨水)', emoji: '🌧️', desc: '눈이 녹아 비가 되고 대동강 물이 풀린다는 절기입니다.', tip: '얼었던 땅이 녹아 씨앗을 뿌릴 준비를 합니다.', termIndex: 1 },
                    { season: '봄', name: '경칩 (驚蟄)', emoji: '🐸', desc: '겨울잠을 자던 동물들이 깨어나는 시기입니다.', tip: '논둑의 풀을 태우거나 해충을 방제합니다.', termIndex: 2 },
                    { season: '봄', name: '춘분 (春分)', emoji: '🌸', desc: '낮과 밤의 길이가 같아지고 본격적인 농사철이 시작됩니다.', tip: '논밭을 갈고 씨앗 파종을 시작합니다.', termIndex: 3 },
                    { season: '봄', name: '청명 (淸明)', emoji: '🌤️', desc: '날씨가 화창하여 봄 농사 준비가 가장 바쁜 때입니다.', tip: '논에 물꼬를 대고 모판을 만듭니다.', termIndex: 4 },
                    { season: '봄', name: '곡우 (穀雨)', emoji: '💧', desc: '농사비가 내려 백곡을 윤택하게 한다는 절기입니다.', tip: '못자리르 설치하고 벼농사 파종을 마무리합니다.', termIndex: 5 },
                    { season: '여름', name: '입하 (立夏)', emoji: '☀️', desc: '여름의 시작을 알리며 초록빛이 짙어지는 시기입니다.', tip: '보리 베기와 모내기 준비가 한창입니다.', termIndex: 6 },
                    { season: '여름', name: '소만 (小滿)', emoji: '🌾', desc: '모내기가 시작되고 들판이 푸르러지는 때입니다.', tip: '본격적인 모내기(이모작)를 진행합니다.', termIndex: 7 },
                    { season: '여름', name: '망종 (芒種)', emoji: '🌾', desc: '씨앗을 뿌리기 가장 좋은 시기로 보리를 베고 모를 심습니다.', tip: '보리 수확과 모내기가 겹쳐 농촌이 가장 바쁩니다.', termIndex: 8 },
                    { season: '여름', name: '하지 (夏至)', emoji: '🌞', desc: '낮이 가장 긴 절기로 감자를 수확합니다.', tip: '가뭄에 대비해 논에 물을 대는 논매기를 합니다.', termIndex: 9 },
                    { season: '여름', name: '소서 (小暑)', emoji: '🔥', desc: '더위가 시작되고 장마가 드는 시기입니다.', tip: '김매기와 잡초 제거를 철저히 해야 합니다.', termIndex: 10 },
                    { season: '여름', name: '대서 (大暑)', emoji: '🌡️', desc: '가장 더위가 심한 때로 곡식이 무럭무럭 자랍니다.', tip: '태풍과 병해충 피해를 막기 위해 관리합니다.', termIndex: 11 },
                    { season: '가을', name: '입추 (立秋)', emoji: '🍂', desc: '가을의 시작으로 서늘한 바람이 불기 시작합니다.', tip: '김장 채소(배추, 무) 씨앗을 뿌립니다.', termIndex: 12 },
                    { season: '가을', name: '처서 (處暑)', emoji: '🦗', desc: '더위가 가시고 모기도 입이 비뚤어진다는 절기입니다.', tip: '곡식이 익어가는 시기로 햇볕을 쪼여줍니다.', termIndex: 13 },
                    { season: '가을', name: '백로 (白露)', emoji: '💧', desc: '이슬이 맺히며 완연한 가을 날씨가 됩니다.', tip: '벼의 이삭이 패고 여무는 중요한 시기입니다.', termIndex: 14 },
                    { season: '가을', name: '추분 (秋分)', emoji: '🍁', desc: '밤과 낮의 길이가 같아지며 수확이 시작됩니다.', tip: '고추 말리기와 곡식 수확을 준비합니다.', termIndex: 15 },
                    { season: '가을', name: '한로 (寒露)', emoji: '🌾', desc: '찬 이슬이 맺히기 시작하며 곡식을 거둡니다.', tip: '오곡백과를 본격적으로 수확합니다.', termIndex: 16 },
                    { season: '가을', name: '상강 (霜降)', emoji: '❄️', desc: '서리가 내리기 시작하며 가을 농사가 마무리됩니다.', tip: '고구마와 늦깎이 곡식을 모두 수확합니다.', termIndex: 17 },
                    { season: '겨울', name: '입동 (立冬)', emoji: '🧥', desc: '겨울의 시작으로 김장을 담그는 시기입니다.', tip: '월동 준비를 하고 농기구를 정비합니다.', termIndex: 18 },
                    { season: '겨울', name: '소설 (小雪)', emoji: '🌨️', desc: '첫눈이 내리기 시작하는 추운 절기입니다.', tip: '바람을 막고 가축을 따뜻하게 보살핍니다.', termIndex: 19 },
                    { season: '겨울', name: '대설 (大雪)', emoji: '❄️', desc: '눈이 많이 내리며 겨울 추위가 심해집니다.', tip: '농한기를 맞아 내년 농사를 구상합니다.', termIndex: 20 },
                    { season: '겨울', name: '동지 (冬至)', emoji: '🥣', desc: '밤이 가장 길고 팥죽을 먹는 날입니다.', tip: '휴식을 취하며 묵은해를 마무리합니다.', termIndex: 21 },
                    { season: '겨울', name: '소한 (小寒)', emoji: '🥶', desc: '대한이보다 소한에 추위가 더 매섭다는 한겨울입니다.', tip: '곳간을 관리하며 겨울을 납니다.', termIndex: 22 },
                    { season: '겨울', name: '대한 (大寒)', emoji: '🧊', desc: '겨울의 마지막 추위 절기입니다.', tip: '봄이 오기를 기다리며 씨앗을 점검합니다.', termIndex: 23 }
                ],

                get currentTerm() {
                    return this.termsList[this.termIndex];
                },

                get cropStatusText() {
                    if (this.cropStage === 0) return '밭이 비어있음';
                    if (this.cropStage === 1) return '새싹 자라는 중';
                    if (this.cropStage === 2) return '무럭무럭 성장 중';
                    if (this.cropStage === 3) return '수확 대기 완료!';
                    return '';
                },

                get workButtonText() {
                    if (this.cropStage === 1) return '물 주기 및 김매기 💧';
                    if (this.cropStage === 2) return '거름 주기 및 관리 🌿';
                    return '작업하기';
                },

                openSeedModal() {
                    this.seedModalOpen = true;
                },

                selectSeed(seed) {
                    if (this.money < seed.cost) {
                        alert('자금(엽전)이 부족합니다!');
                        return;
                    }
                    this.money -= seed.cost;
                    this.currentCropData = seed;
                    this.cropName = seed.name;
                    this.cropEmoji = seed.emoji;
                    this.cropStage = 1;
                    this.growthRate = 25;
                    this.seedModalOpen = false;
                },

                doFarmWork() {
                    if (this.cropStage === 1) {
                        this.cropStage = 2;
                        this.growthRate = 65;
                        this.knowledge += 5;
                    } else if (this.cropStage === 2) {
                        this.cropStage = 3;
                        this.growthRate = 100;
                        this.knowledge += 10;
                    }
                },

                harvestCrop() {
                    const reward = this.currentCropData ? this.currentCropData.reward : 50;
                    this.money += reward;
                    this.knowledge += 20;
                    alert(`대풍년입니다! ${reward} 냥의 수익을 얻었습니다! 💰`);
                    this.cropStage = 0;
                    this.cropName = '없음';
                    this.cropEmoji = '🟫';
                    this.growthRate = 0;
                    this.currentCropData = null;
                },

                nextTerm() {
                    this.termIndex = (this.termIndex + 1) % this.termsList.length;
                    this.knowledge += 2;
                }
            }
        }
    </script>
</body>
